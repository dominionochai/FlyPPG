name: MCD FlyPPG vs SmartSpectra baseline

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mcd-head-to-head.yml"
      - "experiments/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  head-to-head:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install processing and Vulkan runtime dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg libvulkan1 mesa-vulkan-drivers vulkan-tools
          vulkaninfo --summary || true
          python -m pip install --upgrade pip
          python -m pip install numpy scipy opencv-python-headless

      - name: Download MCD video and synchronized reference
        shell: bash
        run: |
          set -euo pipefail
          base="https://huggingface.co/datasets/akramic/mcd_rppg/resolve/04df5b6"
          curl -fL --retry 2 --connect-timeout 20 --max-time 180 "$base/video/1020_USBVideo_before.avi" -o video.avi
          curl -fL --retry 2 --connect-timeout 20 --max-time 60 "$base/ppg_sync/1020_USBVideo_before.txt" -o ppg_sync.txt
          test "$(stat -c%s video.avi)" -gt 10000000
          test "$(wc -l < ppg_sync.txt)" -gt 1000
          ffmpeg -y -i video.avi -an -c:v libx264 -preset veryfast -pix_fmt yuv420p video.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=avg_frame_rate,nb_frames -of default=noprint_wrappers=1 video.mp4

      - name: Install SmartSpectra SDK
        run: npm install --no-save @smartspectra/node-sdk

      - name: Run SmartSpectra on original video
        id: smartspectra
        continue-on-error: true
        env:
          SMARTSPECTRA_API_KEY: ${{ secrets.SMARTSPECTRA_API_KEY }}
        run: node experiments/smartspectra_file_run.mjs video.mp4 smartspectra_results

      - name: Smoke-test SmartSpectra custom-frame input
        if: always()
        continue-on-error: true
        env:
          SMARTSPECTRA_API_KEY: ${{ secrets.SMARTSPECTRA_API_KEY }}
        run: node experiments/smartspectra_custom_input_run.mjs video.mp4 smartspectra_custom_input

      - name: Run FlyPPG and score against synchronized PPG
        if: always()
        run: |
          python experiments/mcd_head_to_head.py \
            --video video.mp4 \
            --reference ppg_sync.txt \
            --smartspectra smartspectra_results/metrics.json \
            --out head_to_head.json

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcd-flyppg-smartspectra-baseline
          path: |
            head_to_head.json
            smartspectra_results/
            smartspectra_custom_input/
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce valid SmartSpectra output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          file_pulses=0
          custom_pulses=0
          if [ -f smartspectra_results/summary.json ]; then
            file_pulses="$(node -e "const x=require('./smartspectra_results/summary.json'); process.stdout.write(String(x.pulse_packet_count ?? 0))")"
          fi
          if [ -f smartspectra_custom_input/metrics.json ]; then
            custom_pulses="$(node -e "const x=require('./smartspectra_custom_input/metrics.json'); process.stdout.write(String(x.summary?.pulse_packet_count ?? 0))")"
          fi
          echo "File-input pulse packets: $file_pulses"
          echo "Custom-input pulse packets: $custom_pulses"
          if [ "$file_pulses" -eq 0 ] && [ "$custom_pulses" -eq 0 ]; then
            echo "::error::INVALID_NO_OUTPUT: no SmartSpectra pulse readings from either input path."
            exit 1
          fi
