name: MCD single-recording access check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mcd-single-recording-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-one-recording:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out FlyPPG
        uses: actions/checkout@v4

      - name: Download one licensed MCD-rPPG video and its synchronized PPG reference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mcd-one
          base="https://huggingface.co/datasets/akramic/mcd_rppg/resolve/04df5b6"
          curl -fL --retry 2 --connect-timeout 20 --max-time 180 \
            "$base/video/1020_IriunWebcam_before.avi" \
            -o /tmp/mcd-one/video.avi
          curl -fL --retry 2 --connect-timeout 20 --max-time 60 \
            "$base/ppg_sync/1020_IriunWebcam_before.txt" \
            -o /tmp/mcd-one/ppg_sync.txt
          test "$(stat -c%s /tmp/mcd-one/video.avi)" -gt 10000000
          test "$(stat -c%s /tmp/mcd-one/ppg_sync.txt)" -gt 10000
          echo "Video bytes: $(stat -c%s /tmp/mcd-one/video.avi)"
          echo "Reference bytes: $(stat -c%s /tmp/mcd-one/ppg_sync.txt)"

      - name: Inspect video stream and synchronized reference
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffprobe -v error -select_streams v:0 -count_frames \
            -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames,nb_read_frames,duration,time_base \
            -of json /tmp/mcd-one/video.avi | tee /tmp/mcd-one/video_metadata.json
          ffprobe -v error -select_streams v:0 -show_entries frame=best_effort_timestamp_time \
            -of csv=p=0 /tmp/mcd-one/video.avi > /tmp/mcd-one/frame_timestamps.txt
          ffmpeg -v error -i /tmp/mcd-one/video.avi -f null -
          python - <<'PY'
          import json
          from pathlib import Path
          import statistics

          meta = json.loads(Path("/tmp/mcd-one/video_metadata.json").read_text())
          streams = meta.get("streams", [])
          if not streams:
              raise SystemExit("No video stream found in downloaded AVI")
          stream = streams[0]
          rows = []
          for line in Path("/tmp/mcd-one/ppg_sync.txt").read_text().splitlines():
              parts = line.split()
              if len(parts) == 2:
                  rows.append((float(parts[0]), float(parts[1])))
          if len(rows) < 1000:
              raise SystemExit(f"Unexpected synchronized PPG row count: {len(rows)}")

          frame_times = []
          for line in Path("/tmp/mcd-one/frame_timestamps.txt").read_text().splitlines():
              try:
                  frame_times.append(float(line.strip()))
              except ValueError:
                  continue

          second_column = [row[1] for row in rows]
          second_deltas = [b - a for a, b in zip(second_column, second_column[1:])]
          print({
              "video_stream": stream,
              "decoded_frame_timestamp_count": len(frame_times),
              "video_first_frame_time": frame_times[0] if frame_times else None,
              "video_last_frame_time": frame_times[-1] if frame_times else None,
              "video_timestamp_span_seconds": frame_times[-1] - frame_times[0] if len(frame_times) > 1 else None,
              "reference_rows": len(rows),
              "reference_first_rows": rows[:5],
              "reference_last_rows": rows[-5:],
              "reference_column_1_range": [min(r[0] for r in rows), max(r[0] for r in rows)],
              "reference_column_2_range": [min(second_column), max(second_column)],
              "reference_column_2_delta_median": statistics.median(second_deltas) if second_deltas else None,
              "reference_column_2_delta_min": min(second_deltas) if second_deltas else None,
              "reference_column_2_delta_max": max(second_deltas) if second_deltas else None,
              "reference_rows_equal_decoded_frames": len(rows) == len(frame_times),
          })
          PY
          rm -rf /tmp/mcd-one
