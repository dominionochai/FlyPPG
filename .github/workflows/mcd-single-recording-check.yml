name: MCD single-recording access check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mcd-single-recording-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-one-recording:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out FlyPPG
        uses: actions/checkout@v4

      - name: Download one licensed MCD-rPPG video and its synchronized PPG reference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mcd-one
          base="https://huggingface.co/datasets/akramic/mcd_rppg/resolve/04df5b6"
          curl -fL --retry 2 --connect-timeout 20 --max-time 180 \
            "$base/video/1020_IriunWebcam_before.avi" \
            -o /tmp/mcd-one/video.avi
          curl -fL --retry 2 --connect-timeout 20 --max-time 60 \
            "$base/ppg_sync/1020_IriunWebcam_before.txt" \
            -o /tmp/mcd-one/ppg_sync.txt
          test "$(stat -c%s /tmp/mcd-one/video.avi)" -gt 10000000
          test "$(stat -c%s /tmp/mcd-one/ppg_sync.txt)" -gt 10000
          echo "Video bytes: $(stat -c%s /tmp/mcd-one/video.avi)"
          echo "Reference bytes: $(stat -c%s /tmp/mcd-one/ppg_sync.txt)"

      - name: Inspect video stream and synchronized reference
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames,duration \
            -of json /tmp/mcd-one/video.avi | tee /tmp/mcd-one/video_metadata.json
          ffmpeg -v error -i /tmp/mcd-one/video.avi -frames:v 1 -f null -
          python - <<'PY'
          import json
          import numpy as np
          from pathlib import Path

          meta = json.loads(Path("/tmp/mcd-one/video_metadata.json").read_text())
          streams = meta.get("streams", [])
          if not streams:
              raise SystemExit("No video stream found in downloaded AVI")
          stream = streams[0]
          ref = np.loadtxt("/tmp/mcd-one/ppg_sync.txt")
          if ref.ndim != 2 or ref.shape[1] != 2 or len(ref) < 1000:
              raise SystemExit(f"Unexpected synchronized PPG shape: {ref.shape}")
          print({
              "video": stream,
              "decoded_first_frame": True,
              "reference_rows": int(ref.shape[0]),
              "reference_columns": int(ref.shape[1]),
              "reference_first_rows": ref[:3].tolist(),
              "reference_last_rows": ref[-3:].tolist(),
              "reference_interval_median_seconds": float(np.median(ref[:, 1])),
              "reference_interval_min_seconds": float(np.min(ref[:, 1])),
              "reference_interval_max_seconds": float(np.max(ref[:, 1])),
          })
          PY
          rm -rf /tmp/mcd-one
