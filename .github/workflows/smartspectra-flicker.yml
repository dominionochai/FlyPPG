name: SmartSpectra flicker experiment (flicker, entrainment trap, and FlyPPG denotch/nearref fixes)

# Does SmartSpectra degrade under TV/monitor-style flicker (a limitation its own docs list), and does FlyPPG's fly-lamina-style
# near-face divisive normalisation restore it? File playback is paced in real time (documented interframeDelayMs) because the
# earlier as-fast-as-possible runs dropped 23-56% of frames and made results non-deterministic. Pseudo-reference = SmartSpectra's
# own clean-clip readings (this dataset has no ground-truth pulse). Results are published to the ci-diagnostics branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flicker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install video and Vulkan tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3 libvulkan1 mesa-vulkan-drivers vulkan-tools
          ffmpeg -version | head -n 1
          echo "Installed Vulkan ICDs:"
          ls -la /usr/share/vulkan/icd.d/ || true
          echo "Vulkan loader summary:"
          vulkaninfo --summary || true

      - name: Configure software Vulkan (Mesa lavapipe)
        shell: bash
        run: |
          set -euo pipefail
          ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f \( -name 'lvp_icd*.json' -o -name '*lvp*.json' \) | head -n 1)"
          if [ -z "$ICD" ]; then
            echo "Mesa lavapipe ICD was not installed."
            exit 1
          fi
          echo "Using Vulkan ICD: $ICD"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$ICD" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$ICD" VK_DRIVER_FILES="$ICD" vulkaninfo --summary

      - name: Download a frontal chest recording from MPSC-RR
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import urllib.parse
          import urllib.request

          api = "https://huggingface.co/api/datasets/justchugh/MPSC-RR/tree/main?recursive=true"
          req = urllib.request.Request(api, headers={"User-Agent": "FlyPPG-dataset-test/1.0"})
          with urllib.request.urlopen(req, timeout=60) as response:
              entries = json.load(response)

          candidates = [
              item for item in entries
              if item.get("type") == "file"
              and pathlib.PurePosixPath(item["path"]).name.lower() in {"s1_front.mov", "s1_front.mp4"}
          ]
          if not candidates:
              candidates = [
                  item for item in entries
                  if item.get("type") == "file"
                  and "front" in pathlib.PurePosixPath(item["path"]).stem.lower()
                  and pathlib.PurePosixPath(item["path"]).suffix.lower() in {".mov", ".mp4"}
              ]
          if not candidates:
              raise SystemExit("No frontal chest video found in MPSC-RR repository tree.")

          chosen = candidates[0]["path"]
          url = "https://huggingface.co/datasets/justchugh/MPSC-RR/resolve/main/" + urllib.parse.quote(chosen, safe="/")
          req = urllib.request.Request(url, headers={"User-Agent": "FlyPPG-dataset-test/1.0"})
          with urllib.request.urlopen(req, timeout=180) as response, open("chest_source_video", "wb") as output:
              while True:
                  chunk = response.read(1024 * 1024)
                  if not chunk:
                      break
                  output.write(chunk)

          size = pathlib.Path("chest_source_video").stat().st_size
          if size < 100_000:
              raise SystemExit(f"Downloaded file is unexpectedly small: {size} bytes")
          pathlib.Path("dataset_source.txt").write_text(
              f"dataset=justchugh/MPSC-RR\nfile={chosen}\nbytes={size}\nlicense=CC-BY-4.0\n",
              encoding="utf-8",
          )
          print(f"Downloaded {chosen}: {size:,} bytes")
          PY
          ffmpeg -y -i chest_source_video -an -vf "scale=trunc(iw/2)*2:trunc(ih/2)*2" -c:v libx264 -preset veryfast -pix_fmt yuv420p chest_test.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,avg_frame_rate,duration -of json chest_test.mp4 | tee video_probe.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SDK and FlyPPG dependencies
        shell: bash
        run: |
          set -uo pipefail
          npm install --no-save @smartspectra/node-sdk > npm.log 2>&1 || { echo "::error::npm install failed: $(tail -n 3 npm.log | tr '\n' ' ')"; exit 1; }
          python -m pip install --upgrade pip > pip.log 2>&1
          python -m pip install numpy scipy opencv-python-headless imageio-ffmpeg mediapipe==0.10.14 >> pip.log 2>&1 || { echo "::error::pip install failed: $(tail -n 5 pip.log | tr '\n' ' ')"; exit 1; }
          python -c "import cv2, mediapipe, scipy, numpy, imageio_ffmpeg; print('imports ok', cv2.__version__, numpy.__version__)"

      - name: Build the ten clips (clean / broadband flicker / entrainment trap, each with FlyPPG denotch or near-face normalisation)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p clips out/runs
          python experiments/flicker_experiment.py inject chest_test.mp4 clips/clean.mp4 --strength 0        # same encoder for every clip
          python experiments/flicker_experiment.py inject chest_test.mp4 clips/fl06.mp4 --strength 0.06 --seed 1
          python experiments/flicker_experiment.py inject chest_test.mp4 clips/fl12.mp4 --strength 0.12 --seed 1
          python experiments/flicker_experiment.py inject chest_test.mp4 clips/ent088.mp4 --strength 0.08 --freq-bpm 88   # trap: an 88 bpm reading is locked to the light
          for c in fl06 fl12 ent088; do python3 experiments/flicker_experiment.py denotch clips/$c.mp4 clips/${c}_dn.mp4 | tee out/denotch_$c.log; done
          for c in clean fl06 fl12; do python3 experiments/flicker_experiment.py nearref clips/$c.mp4 clips/${c}_nr.mp4 2>&1 | grep -v -E "^(W0000|I0000|INFO)" | tee out/nearref_$c.log; done
          ls -l clips

      - name: SmartSpectra on all ten clips, 2 repeats, real-time paced, first 60 s
        env:
          SMARTSPECTRA_API_KEY: ${{ secrets.SMARTSPECTRA_API_KEY }}
        shell: bash
        run: |
          set +e
          for rep in 1 2; do for c in clean clean_nr fl06 fl06_dn fl06_nr fl12 fl12_dn fl12_nr ent088 ent088_dn; do
            n=${c}_r${rep}
            node experiments/smartspectra_file_run.mjs clips/$c.mp4 out/runs/$n --metrics=cardio --label=$n --interframe-delay-ms=33 --max-duration-ms=60000 > out/$n.log 2>&1
            sed -i "s|${SMARTSPECTRA_API_KEY}|***|g" out/$n.log
            echo "$n exit=$? $(python3 -c "import json;s=json.load(open('out/runs/$n/summary.json'));print(s['status'],'usable',s['pulse_samples_nonzero_confidence'],'events',s['validation_event_count'])" 2>/dev/null)"
          done; done

      - name: Score
        if: always()
        run: |
          set +e
          python experiments/flicker_score.py out/runs --flicker-bpm 88 | tee -a "$GITHUB_STEP_SUMMARY"
          find out -name metrics.json -size +4M -delete

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flicker-experiment
          path: out/
          retention-days: 30

      - name: Publish to ci-diagnostics (readable without artifact access)
        if: always()
        shell: bash
        run: |
          set +e
          grep -rIl -F "${SMARTSPECTRA_API_KEY}" out && { echo "::error::API key found in outputs; not publishing"; exit 1; }
          cp out/../SCORES.md out/SCORES.md 2>/dev/null
          git config user.name github-actions; git config user.email actions@users.noreply.github.com
          git fetch origin ci-diagnostics:ci-diagnostics 2>/dev/null; git checkout -f ci-diagnostics 2>/dev/null || git checkout --orphan ci-diagnostics
          mkdir -p flicker && rm -rf "flicker/run-${GITHUB_RUN_ID}" && cp -r out "flicker/run-${GITHUB_RUN_ID}"
          git add flicker && git commit -q -m "flicker experiment ${GITHUB_RUN_ID}" && git push origin HEAD:ci-diagnostics
        env:
          SMARTSPECTRA_API_KEY: ${{ secrets.SMARTSPECTRA_API_KEY }}
