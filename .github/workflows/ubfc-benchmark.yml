name: UBFC real-video benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ubfc-benchmark.yml
      - experiments/ubfc_single.py
      - flyppg3.py
      - flyppg.py
      - fly_conn.py
      - connectome/**
      - readout_W3.npy

permissions:
  contents: read

jobs:
  ubfc-single:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: benchmark/integrity-audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install benchmark dependencies
        run: python -m pip install --upgrade pip numpy scipy opencv-python-headless gdown
      - name: Download public UBFC dataset to runner
        run: |
          python - <<'PY'
          import gdown
          url = "https://drive.google.com/drive/folders/1o0XU4gTIo46YfwaWjIgbtCncc-oF44Xk"
          paths = gdown.download_folder(url, output="ubfc_data", quiet=False, remaining_ok=True)
          if not paths:
              raise SystemExit("Google Drive returned no downloadable files")
          print(f"Downloaded {len(paths)} files")
          PY
      - name: Locate first video with synchronized HR reference
        id: locate
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          root = Path("ubfc_data")
          matches = sorted(p.parent for p in root.rglob("vid.avi")
                           if (p.parent / "ground_truth.txt").is_file())
          if not matches:
              raise SystemExit("No vid.avi + ground_truth.txt pair found in downloaded folder")
          subject = matches[0]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"video={subject / 'vid.avi'}\n")
              f.write(f"ground_truth={subject / 'ground_truth.txt'}\n")
          print("Selected:", subject)
          PY
      - name: Run raw POS and FlyPPG preprocessing benchmark
        run: |
          python experiments/ubfc_single.py \
            --video "${{ steps.locate.outputs.video }}" \
            --ground-truth "${{ steps.locate.outputs.ground_truth }}" \
            --out ubfc_single_results
      - name: Upload numerical report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubfc-single-benchmark
          path: |
            ubfc_single_results/
            !ubfc_data/
          if-no-files-found: warn
          retention-days: 14
