name: UBFC real-video benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ubfc-single:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install benchmark dependencies
        run: python -m pip install --upgrade pip numpy scipy "opencv-python-headless<5" gdown
      - name: Download one UBFC subject only
        run: |
          mkdir -p ubfc_data/DATASET_2/subject1
          python - <<'PY'
          import gdown
          files = {
              "1q7LX_8Ggfl43ZmsFXMrUkV2hNnKr-yTE": "ubfc_data/DATASET_2/subject1/ground_truth.txt",
              "1qBlkbaB8y3-KlWC_A61KsY42Wjo66ss4": "ubfc_data/DATASET_2/subject1/vid.avi",
          }
          for file_id, output in files.items():
              result = gdown.download(id=file_id, output=output, quiet=False)
              if not result:
                  raise SystemExit(f"Failed to download required file: {output}")
          PY
      - name: Run raw POS and FlyPPG preprocessing benchmark
        run: |
          python experiments/ubfc_single.py \
            --video ubfc_data/DATASET_2/subject1/vid.avi \
            --ground-truth ubfc_data/DATASET_2/subject1/ground_truth.txt \
            --out ubfc_single_results
      - name: Upload numerical report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubfc-single-benchmark
          path: ubfc_single_results/
          if-no-files-found: warn
          retention-days: 14
