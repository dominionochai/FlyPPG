 for(let i=0;i<44;i++){const d=dir(Math.floor(rnd()*NC));mk([at(d,5),V(side*rr(.2,.28),d[1]*.3,d[2]*.3),V(side*rr(.08,.14),-.02,.08),V(side*.02,-.28,.1),V(0,-.5,.08),V(0,-.78,.04)],'out')}

const mkcurve=(pts,r,hex,seg=40,wire=0)=>{const g=new T3.TubeGeometry(new T3.CatmullRomCurve3(pts),seg,r,8,false),m=new T3.Mesh(g,new T3.MeshBasicMaterial({color:hex,transparent:true,opacity:.35,blending:T3.AdditiveBlending,depthWrite:false}));sc.add(m);return m};

{const t=new T3.Mesh(new T3.TorusGeometry(.06,.012,10,40),new T3.MeshBasicMaterial({color:0x40ffc0,transparent:true,opacity:.4,blending:T3.AdditiveBlending,depthWrite:false}));t.position.set(0,.02,.04);sc.add(t);dimMats.push(t.material);
 const arc=(y,w,h)=>{const p=[];for(let i=0;i<=12;i++){const u=i/6-1;p.push(V(u*w,y+h*(1-u*u),.04))}return mkcurve(p,.008,0x40ffc0,30).material};
 dimMats.push(arc(.2,.17,-.05),arc(.1,.12,.03))}

function colors(t){for(let i=0;i<NS;i++){const s=SG[i],k=s[2];let h,a,l=.55,b=0;

  col.setHSL(h,.95,l).multiplyScalar(b);ca[i*6]=ca[i*6+3]=col.r;ca[i*6+1]=ca[i*6+4]=col.g;ca[i*6+2]=ca[i*6+5]=col.b}
 lg.attributes.color.needsUpdate=true;
 for(const[m,k]of caps){m.material.opacity=.04+.32*A.st[k];m.material.color.setHSL([.5,.5,.64,.7,.78,.86][k],.9,.55)}

  if(k=='col')a=A.lam*.9;else if(k=='T4')a=A.x[p.s];else if(k=='T5')a=A.x[4+p.s];else if(k=='out')a=A.v;else a=.03;

 pg.setDrawRange(0,PA.length);pg.attributes.position.needsUpdate=true;pg.attributes.color.needsUpdate=true}
