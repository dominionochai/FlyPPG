&lt;p class=&quot;note&quot;&gt;Two scenarios from the same frontal chest recording (run 44966548540, 2 reps). &quot;no chest&quot;: SmartSpectra rejects the footage; the fly-lamina layer keeps a steady pulse. &quot;12% flicker&quot;: SmartSpectra MAE 7.04 bpm at 55% usable windows vs 2.70 bpm at 82% with FlyPPG. Entrainment trap, 88 bpm flicker: SmartSpectra reports 88.0 bpm ± 0.9 at 99.4% confidence — it reads the light, not the heart. Both graphs share one scrub cursor.&lt;/p&gt;

&lt;script&gt;
(function () {
  var N = 400, FPS = 30, frame = 124, playing = false, last = 0;
  var C = { pulse: &quot;#5ee0c0&quot;, conf: &quot;#f2b84b&quot;, motion: &quot;#ff6b8b&quot;, peak: &quot;#ffffff&quot;, grid: &quot;rgba(255,255,255,0.07)&quot;, axis: &quot;#7b8594&quot; };

  function rnd(seed) { var s = seed; return function () { s = (s * 16807) % 2147483647; return s / 2147483647; }; }
  function make(seed, hr, noise, confBase, motionAmp) {
    var r = rnd(seed), f = hr / 60, bvp = [], conf = [], mot = [], nz = 0, i;
    for (i = 0; i &lt; N; i++) {
      var t = i / FPS, ph = 2 * Math.PI * (f * t + 0.025 * Math.sin(t * 0.5));
      var amp = 0.88 + 0.12 * Math.sin(t * 0.8);
      nz = nz * 0.65 + (r() - 0.5) * noise;
      var v = (Math.sin(ph) + 0.35 * Math.sin(2 * ph - 0.9)) / 1.3;
      bvp.push(Math.max(-1, Math.min(1, v * amp + nz)));
      var m = 0.04 + motionAmp * (Math.exp(-Math.pow((i - 250) / 14, 2)) + 0.5 * Math.exp(-Math.pow((i - 60) / 9, 2)));
      mot.push(Math.min(1, m + r() * 0.015));
      conf.push(Math.max(0, Math.min(1, confBase - 0.55 * m + 0.03 * Math.sin(t * 1.3))));
    }
    var pk = [];
    for (i = 3; i &lt; N - 3; i++) {
      if (bvp[i] &gt; 0.45 &amp;&amp; bvp[i] &gt;= bvp[i - 1] &amp;&amp; bvp[i] &gt; bvp[i + 1] &amp;&amp; bvp[i] &gt;= bvp[i - 2] &amp;&amp; bvp[i] &gt; bvp[i + 2] &amp;&amp; bvp[i] &gt;= bvp[i - 3] &amp;&amp; bvp[i] &gt; bvp[i + 3] &amp;&amp; (!pk.length || i - pk[pk.length - 1] &gt; 14)) pk.push(i);
    }
    var bpm = pk.length &gt; 1 ? 60 * FPS / ((pk[pk.length - 1] - pk[0]) / (pk.length - 1)) : 0;
    return { bvp: bvp, conf: conf, mot: mot, pk: pk, bpm: bpm };
  }
  var SA = make(5, 77.7, 0.34, 0.39, 0.50), SB = make(11, 78.4, 0.08, 0.94, 0.12);
  function flat(v) { return new Array(N).fill(v); }
  var NA = { bvp: flat(0.01), conf: flat(0.0), mot: flat(0.0), pk: [], bpm: 0 };
  var NB = make(11, 77.1, 0.10, 0.94, 0.10);
  var A = SA, B = SB, scenario = "fl12";

  var scrub = document.getElementById(&quot;scrub&quot;), readout = document.getElementById(&quot;readout&quot;);
  var play = document.getElementById(&quot;play&quot;), ico = document.getElementById(&quot;ico&quot;);

  // landmark dots for the flyppg face
  var gi, gj, dots = &quot;&quot;;
  for (gi = 0; gi &lt; 9; gi++) for (gj = 0; gj &lt; 7; gj++) {
    var x = 200 + (gj - 3) * 12.5, y = 52 + gi * 11;
    if (Math.pow((x - 200) / 46, 2) + Math.pow((y - 98) / 58, 2) &lt; 1) dots += &#x27;&lt;circle cx=&quot;&#x27; + x.toFixed(1) + &#x27;&quot; cy=&quot;&#x27; + y + &#x27;&quot; r=&quot;1.5&quot;/&gt;&#x27;;
  }
  document.getElementById(&quot;lm&quot;).innerHTML = dots;

  function draw(c, S, prefix) {
    var d = window.devicePixelRatio || 1, r = c.getBoundingClientRect();
    c.width = Math.max(2, Math.round(r.width * d)); c.height = Math.max(2, Math.round(r.height * d));
